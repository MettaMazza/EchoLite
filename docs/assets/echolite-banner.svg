<text x="72" y="355" fill="#9fb5a6" font-family="Arial,Helvetica,sans-serif" font-size="17">Persistent memory. Grounded tools. An editable sense of self.</text>
<text x="72" y="387" fill="#728d7b" font-family="Arial,Helvetica,sans-serif" font-size="14">Built in Ernos Plain · Developed on an 8 GB Apple Silicon Mac</text>
